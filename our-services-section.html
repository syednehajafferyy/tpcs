<!-- ============================================================
  TPCS — OUR SERVICES (single section, sits directly under the Hero)
  Scoped under .tpcs-services; nothing else on the page is touched.
  Icons are light blue (same blue as the heading underline) and each
  one is drawn to match its label.
============================================================ -->
<section id="services" class="tpcs-services" aria-labelledby="tpcs-services-title">
  <style>
    .tpcs-services{
      --sv-blue:#2fa4e0;            /* same light blue as the heading underline */
      --sv-blue-soft:rgba(47,164,224,.12);
      --sv-ink:#243447;
      --sv-muted:#5b6674;
      font-family:inherit;background:#f8fafc;color:var(--sv-ink);
      padding:72px 20px 88px;
    }
    .tpcs-services *{box-sizing:border-box}
    .tpcs-services__inner{max-width:1000px;margin:0 auto}
    .tpcs-services__head{text-align:center;margin:0 auto 44px}
    .tpcs-services__title{margin:0;font-size:clamp(1.4rem,2.4vw,1.8rem);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    .tpcs-services__title::after{content:"";display:block;width:74px;height:3px;margin:12px auto 0;background:var(--sv-blue);border-radius:3px}
    .tpcs-services__lead{margin:18px 0 0;color:var(--sv-muted);font-size:1rem}

    .tpcs-services__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;list-style:none;margin:0;padding:0}
    @media (max-width:820px){.tpcs-services__grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:480px){.tpcs-services{padding:56px 16px 64px}.tpcs-services__grid{gap:14px}}
    @media (max-width:820px){.tpcs-svc{justify-content:flex-start;padding-top:26px}.tpcs-svc__name{min-height:2.6em;display:flex;align-items:flex-start;justify-content:center}}

    .tpcs-svc{
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      height:100%;min-height:176px;padding:28px 16px;text-align:center;
      background:#fff;border:1px solid #e8eef4;border-radius:20px;color:inherit;text-decoration:none;
      box-shadow:0 8px 26px rgba(47,164,224,.09);
      transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
    }
    .tpcs-svc:hover,.tpcs-svc:focus-visible{transform:translateY(-5px);border-color:var(--sv-blue);box-shadow:0 16px 34px rgba(47,164,224,.22);outline:none}
    .tpcs-svc:focus-visible{outline:3px solid var(--sv-blue);outline-offset:3px}
    .tpcs-svc__icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--sv-blue-soft);transition:background .25s ease}
    .tpcs-svc__icon svg{width:40px;height:40px;fill:none;stroke:var(--sv-blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s ease}
    .tpcs-svc__icon .fill{fill:var(--sv-blue);stroke:none;transition:fill .25s ease}
    .tpcs-svc:hover .tpcs-svc__icon{background:var(--sv-blue)}
    .tpcs-svc:hover .tpcs-svc__icon svg{stroke:#fff}
    .tpcs-svc:hover .tpcs-svc__icon .fill{fill:#fff}
    .tpcs-svc__name{margin:0;font-size:1.02rem;font-weight:700;line-height:1.3}
    @media (prefers-reduced-motion:reduce){.tpcs-svc,.tpcs-svc__icon,.tpcs-svc__icon svg{transition:none}.tpcs-svc:hover{transform:none}}
  </style>

  <div class="tpcs-services__inner">
    <header class="tpcs-services__head">
      <h2 id="tpcs-services-title" class="tpcs-services__title">Our Services</h2>
      <p class="tpcs-services__lead">Pest control and fumigation services in Karachi.</p>
    </header>

    <ul class="tpcs-services__grid">

      <!-- Fumigation: spray bottle with mist -->
      <li><a class="tpcs-svc" href="#contact">
        <span class="tpcs-svc__icon"><svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="17" y="9" width="15" height="9" rx="2.5"/><path d="M32 13h5l-3 8"/><path d="M17 12h-4"/>
          <path d="M21 18v5M27 18v5"/><path d="M17 23h13v17a3 3 0 0 1-3 3h-7a3 3 0 0 1-3-3z"/><path d="M17 32h13"/>
          <circle class="fill" cx="8" cy="9" r="1.4"/><circle class="fill" cx="5" cy="14" r="1.4"/><circle class="fill" cx="9" cy="17" r="1.4"/><circle class="fill" cx="5" cy="21" r="1.4"/>
        </svg></span>
        <h3 class="tpcs-svc__name">Fumigation</h3></a></li>

      <!-- Termite Control: termite with antennae and six legs -->
      <li><a class="tpcs-svc" href="#contact">
        <span class="tpcs-svc__icon"><svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="10" r="4.5"/><path d="M21.5 6.5 18 2M26.5 6.5 30 2"/>
          <ellipse cx="24" cy="21" rx="5" ry="5"/><ellipse cx="24" cy="35" rx="7.5" ry="9"/>
          <path d="M19 19 10 15M19 22 9 25M19.5 25 11 33M29 19l9-4M29 22l10 3M28.5 25l8.5 8"/>
          <path d="M24 28v15"/>
        </svg></span>
        <h3 class="tpcs-svc__name">Termite Control</h3></a></li>

      <!-- corona virus Protection: virus particle -->
      <li><a class="tpcs-svc" href="#contact">
        <span class="tpcs-svc__icon"><svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="9"/>
          <g><path d="M33 24h4"/><circle cx="39.5" cy="24" r="2"/></g>
          <g transform="rotate(45 24 24)"><path d="M33 24h4"/><circle cx="39.5" cy="24" r="2"/></g>
          <g transform="rotate(90 24 24)"><path d="M33 24h4"/><circle cx="39.5" cy="24" r="2"/></g>
          <g transform="rotate(135 24 24)"><path d="M33 24h4"/><circle cx="39.5" cy="24" r="2"/></g>
          <g transform="rotate(180 24 24)"><path d="M33 24h4"/><circle cx="39.5" cy="24" r="2"/></g>
          <g transform="rotate(225 24 24)"><path d="M33 24h4"/><circle cx="39.5" cy="24" r="2"/></g>
          <g transform="rotate(270 24 24)"><path d="M33 24h4"/><circle cx="39.5" cy="24" r="2"/></g>
          <g transform="rotate(315 24 24)"><path d="M33 24h4"/><circle cx="39.5" cy="24" r="2"/></g>
          <circle class="fill" cx="21" cy="21.5" r="1.6"/><circle class="fill" cx="27" cy="26" r="1.6"/><circle class="fill" cx="26" cy="20.5" r="1.1"/>
        </svg></span>
        <h3 class="tpcs-svc__name">corona virus Protection</h3></a></li>

      <!-- Mosquitoes: proboscis, wings, long legs -->
      <li><a class="tpcs-svc" href="#contact">
        <span class="tpcs-svc__icon"><svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="13" r="3.2"/><path d="M24 9.8V2M22 11l-4-4M26 11l4-4"/>
          <ellipse cx="24" cy="21" rx="3.8" ry="4"/><ellipse cx="24" cy="33" rx="3" ry="8"/>
          <path d="M20.5 19C15 11 8 11 6 14c-1 4 4 8 14 9"/><path d="M27.5 19C33 11 40 11 42 14c1 4-4 8-14 9"/>
          <path d="M20.5 24 12 31 9 42M20.5 27 14 38l-1 6M27.5 24 36 31l3 11M27.5 27 34 38l1 6"/>
        </svg></span>
        <h3 class="tpcs-svc__name">Mosquitoes</h3></a></li>

      <!-- Rodent: rat in profile with long tail -->
      <li><a class="tpcs-svc" href="#contact">
        <span class="tpcs-svc__icon"><svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M5 30 13 23C19 17 31 17 36 25c3 5 1 11-5 12H16c-5 0-9-3-11-7z"/>
          <circle cx="15" cy="21" r="3.6"/><circle class="fill" cx="11" cy="29" r="1.3"/><circle class="fill" cx="5.5" cy="30" r="1.5"/>
          <path d="M7 32 2 34M7 29.5 2 28.5"/>
          <path d="M37 32c7 1 9-6 5-9s0-7 3-6"/>
          <path d="M17 37v4M30 37v4"/>
        </svg></span>
        <h3 class="tpcs-svc__name">Rodent</h3></a></li>

      <!-- Bed Bugs: round flat bug, short antennae, legs on both sides -->
      <li><a class="tpcs-svc" href="#contact">
        <span class="tpcs-svc__icon"><svg viewBox="0 0 48 48" aria-hidden="true">
          <ellipse cx="24" cy="28" rx="11" ry="13"/><ellipse cx="24" cy="12" rx="4.5" ry="3.8"/>
          <path d="M21.5 9 19 5M26.5 9 29 5"/>
          <path d="M14.5 25q9.500 5 19 0M13.500 31q10.500 5 21 0"/>
          <path d="M14 20 7 17M13 27H5M14 35l-7 4M34 20l7-3M35 27h8M34 35l7 4"/>
        </svg></span>
        <h3 class="tpcs-svc__name">Bed Bugs</h3></a></li>

    </ul>
  </div>
</section>
